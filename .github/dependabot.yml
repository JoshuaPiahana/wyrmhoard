version: 2

# Grouped and monthly on purpose. This is a household tool maintained in
# spare evenings; a daily stream of single-dependency PRs would be noise that
# trains you to ignore the one that matters.
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
    ignore:
      # Patch bumps of the pinned Python only. New Python minors land well
      # before pandas and pydantic ship wheels for them, so an automatic bump
      # breaks the image build - CI caught exactly that on a proposed
      # 3.12 -> 3.14 jump. Moving Python is a deliberate decision that also
      # needs the pyproject requires-python and the CI test matrix updated.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
