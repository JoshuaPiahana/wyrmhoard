name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Individual jobs raise this only if they need to.
permissions:
  contents: read

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Runs first and alone. If financial data or a secret has been committed,
  # nothing else matters and every other job is a waste of time.
  # ---------------------------------------------------------------------
  guard:
    name: Data and secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks needs history, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No financial data in the repository
        run: python scripts/check_no_financial_data.py --all

      # The gitleaks binary directly, not gitleaks-action. The action calls a
      # licensing server and wants permissions beyond `contents: read`, which
      # made it fail on a clean repo - and a security gate that fails for
      # reasons unrelated to security is a gate people learn to ignore.
      # Running the pinned image is faster, needs no token, and is exactly
      # what .pre-commit-config.yaml runs locally.
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner --exit-code=1

  # ---------------------------------------------------------------------
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - run: pip install -r api/requirements.txt

      - name: ruff (lint)
        run: ruff check --output-format=github .

      - name: ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: yamllint
        run: |
          pip install yamllint
          yamllint --strict .

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck hoard scripts/*.sh

      # Through the same compose service `./hoard lint` uses, so the exact
      # eslint version and config run in both places. The dashboard has no
      # build step; Node exists only to lint it.
      - name: eslint (dashboard JS)
        run: docker compose run --rm lint-js

  # ---------------------------------------------------------------------
  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - run: pip install -r api/requirements.txt

      - name: Unit and integration tests
        # The container is pinned to the household's timezone; do the same here
        # so date-boundary behaviour is tested the way it actually runs.
        env:
          TZ: Pacific/Auckland
        run: pytest api/tests -q

  # ---------------------------------------------------------------------
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          load: true
          tags: wyrmhoard-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs and the CLI works
        run: docker run --rm wyrmhoard-api:ci python -m wyrmhoard.cli --help

  # ---------------------------------------------------------------------
  # The full stack, driven through a real browser. This is what catches the
  # failures unit tests cannot see: a renamed JSON key, a handler that throws
  # after an await, a colour that fails contrast, a table that breaks a phone.
  # ---------------------------------------------------------------------
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      # ./hoard e2e brings up its own isolated stack with throwaway data
      # volumes, seeds it, runs the suite and tears it down. Using the same
      # entry point locally and here means CI cannot drift from what a
      # contributor runs.
      - name: Run browser tests
        run: ./hoard e2e

      - name: Build the family report
        run: |
          docker compose up -d --build api
          docker compose run --rm --no-deps api python -m wyrmhoard.cli sample
          docker compose run --rm --no-deps api python -m wyrmhoard.cli ingest --sample
          docker compose run --rm --no-deps api python -m wyrmhoard.cli report

      # The report is a deliverable - being able to open it from a CI run is
      # the fastest way to review a change to it.
      - name: Upload the generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-meeting-report
          path: reports/*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

  # ---------------------------------------------------------------------
  # Proves the quickstart in the README actually works on a clean machine.
  # Documentation rots faster than code; this is the only way to know.
  # ---------------------------------------------------------------------
  core-standalone:
    name: Core installs without an interface
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      # The premise of the packaging split: somebody embedding the analysis
      # engine in their own program should not have to install a web server to
      # compute a number. test_layering.py reads import statements, which
      # cannot catch a dependency arriving transitively - so install the core
      # alone and make it work.
      - run: pip install .

      - name: The engine imports with no web, agent or CLI package present
        run: |
          python - <<'PY'
          import importlib
          import sys

          for module in (
              "wyrmhoard.db",
              "wyrmhoard.config",
              "wyrmhoard.cache",
              "wyrmhoard.categorise",
              "wyrmhoard.accounts",
              "wyrmhoard.coach",
              "wyrmhoard.report",
              "wyrmhoard.samples",
              "wyrmhoard.ingest.bank_csv",
              "wyrmhoard.ingest.payslip",
              "wyrmhoard.analysis.cashflow",
              "wyrmhoard.analysis.income",
              "wyrmhoard.analysis.mortgage",
              "wyrmhoard.analysis.recurring",
              "wyrmhoard.analysis.entitlements",
          ):
              importlib.import_module(module)

          uninvited = {"fastapi", "starlette", "uvicorn", "mcp", "typer"} & set(sys.modules)
          if uninvited:
              raise SystemExit(f"the core pulled in {sorted(uninvited)}")
          print("Analysis engine imported with no interface installed.")
          PY

      - name: Each extra resolves on its own
        run: |
          pip install ".[web]" ".[mcp]" ".[cli]"
          python -c "import wyrmhoard.api, wyrmhoard.mcp_server, wyrmhoard.cli"

  fresh-clone:
    name: Quickstart works from scratch
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      - name: Follow the README quickstart
        run: |
          cp config/household.example.yml config/household.yml
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && break
            sleep 2
          done
          ./hoard sample
          ./hoard ingest --sample
          ./hoard summary
          ./hoard report
          test -f reports/latest.html || { echo "No report produced"; exit 1; }
          echo "Quickstart completed on a clean checkout."
