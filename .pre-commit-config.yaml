# Hooks that run before every commit.
#
#   pip install pre-commit && pre-commit install
#
# Everything here also runs in CI, so a contributor who skips the hooks is
# still caught. The hooks exist to catch it in two seconds instead of two
# minutes, not to be the only line of defence.
default_language_version:
  python: python3

repos:
  # ---- the important one ------------------------------------------------
  - repo: local
    hooks:
      - id: no-financial-data
        name: block financial data from the repo
        entry: python scripts/check_no_financial_data.py
        language: system
        pass_filenames: true
        always_run: true

  # ---- secrets ----------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---- general hygiene --------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-yaml
        # The report template is Jinja, not YAML, and multi-document configs
        # are fine.
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ---- python -----------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^api/kete/
        additional_dependencies:
          - pydantic>=2
          - types-PyYAML
          - types-python-dateutil

  # ---- yaml -------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["--strict"]

  # ---- shell ------------------------------------------------------------
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

exclude: |
  (?x)^(
      data/.*|
      reports/.*|
      web/src/vendor/.*
  )$
