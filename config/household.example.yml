# ===========================================================================
# household.yml - the few things no data source can tell us.
#
#   cp config/household.example.yml config/household.yml
#
# Your copy is gitignored and never leaves your machine.
#
# This file is deliberately short. Anything that CAN be derived from your bank
# exports or payslips IS derived, every time it is needed:
#
#   mortgage balance, rate, repayment, payoff  ->  from the loan account
#   gross income, tax, KiwiSaver rates, tax code -> from payslips
#   which account is everyday / savings / a loan -> inferred, you confirm
#
# None of that is stored here, because a config copy of a derived value is a
# cache that goes stale silently. A mortgage rate typed in once is wrong at
# the next refix, and nothing tells you.
#
# What is left is what only you know.
# ===========================================================================

household:
  name: "Our Household"

  # Gates the region-specific modules. Only NZ has an entitlements module so
  # far; any other value switches that page off and leaves everything else
  # working normally.
  country: NZ

  # Optional. Used only to point you at the right rates-rebate scheme.
  council: null

  # -------------------------------------------------------------------------
  # The three facts no bank export can settle. Each takes three answers, not
  # two, and `null` - "I have not said" - is the shipped default on purpose.
  #
  # An empty `people` list below could mean "no children live here" or "I have
  # not filled this in yet", and those need opposite behaviour. Told there are
  # no children, the tool stops raising Working for Families entirely. Told
  # nothing, it asks - because that credit is usually the largest sum this
  # tool can find, and never mentioning it is a far more expensive mistake
  # than mentioning it once too often.
  #
  # Fill these in and the nagging stops. Leave them and you get questions, not
  # assumptions.
  # -------------------------------------------------------------------------

  # true | false | null. Listing a child under `people` below also answers it.
  has_children: null

  # true | false | null. Entitlements are assessed on combined household
  # income, so a partner changes the arithmetic rather than just the wording.
  has_partner: null

  # owner_with_mortgage | owner_freehold | renting | other | null
  #
  # Left null this is inferred: a loan account in the ledger means a mortgage,
  # several payments categorised as rent mean a tenancy. Set it only to
  # correct a wrong guess - if the loan the tool found is a car loan rather
  # than a home loan, say so here.
  housing: null

# ---------------------------------------------------------------------------
# Who lives here. Nothing else can know this, and it drives the entitlement
# checks - which are usually the largest number this tool can find.
#
# `birth_date` beats `birth_year`: some entitlements turn on an exact age.
# NZ Best Start, for one, is universal under 1 and income-tested from 1 to 3,
# so a child near that boundary is worth getting right to the day.
#
# Leave the list empty if you would rather not record it. The tool will simply
# say it cannot check entitlements, rather than guessing.
# ---------------------------------------------------------------------------
people: []
# people:
#   - name: "Sam"
#     role: earner          # earner | partner | child
#     birth_date: 1988-03-14
#   - name: "Riley"
#     role: child
#     birth_date: 2019-04-12

# ---------------------------------------------------------------------------
# Income that should NOT be planned around.
#
# Payslips supply the actual earnings. This is the judgement call a payslip
# cannot make: which income is irregular enough that the budget must survive
# without it. Anything listed here can accelerate a goal, but is never treated
# as something to rely on.
# ---------------------------------------------------------------------------
upside: []
# upside:
#   - label: "Occasional weekend work"
#   - label: "Annual bonus, not guaranteed"

# ---------------------------------------------------------------------------
# The ladder the coach walks you up. Order matters more than content: a buffer
# before debt repayment is deliberate, because the alternative to a buffer is
# borrowing at a worse rate the first time something breaks.
#
# `target: null` means "work it out from my actual spending".
# ---------------------------------------------------------------------------
goals:
  - id: starter_buffer
    label: "Starter buffer - one month of essentials"
    kind: cash
    target: null
    status: active
  - id: sinking_funds
    label: "Sinking funds for the lumpy annual bills"
    kind: cash
    target: null
    status: pending
  - id: emergency_fund
    label: "Emergency fund - three months of essentials"
    kind: cash
    target: null
    status: pending

settings:
  currency: NZD
  # Spending below this is tracked as "small purchases" - the
  # death-by-a-thousand-cuts number that budgets usually miss entirely.
  small_transaction_threshold: 20
  family_meeting_day: "first Sunday"

# ---------------------------------------------------------------------------
# Overrides. Only for correcting something the tool derived wrongly - never as
# the normal way to supply a value. If you find yourself needing these often,
# the inference is what should be fixed.
# ---------------------------------------------------------------------------
overrides: {}
# overrides:
#   accounts:
#     "38-9014-0123456-05": liability
