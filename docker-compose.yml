# Everything runs in containers. Nothing in this stack talks to the internet -
# no telemetry, no cloud sync, no API keys. Your bank data stays on this disk.
services:

  api:
    build: ./api
    container_name: wyrmhoard-api
    ports:
      - "127.0.0.1:8000:8000"     # loopback only - not exposed to your LAN
    volumes:
      - ./api/wyrmhoard:/app/wyrmhoard      # live reload while developing
      - ./api/tests:/app/tests
      - ./config:/config
      - ./data:/data
      - ./reports:/reports
    environment:
      WYRMHOARD_CONFIG_DIR: /config
      WYRMHOARD_DATA_DIR: /data
      WYRMHOARD_REPORT_DIR: /reports
      # Without this the container runs UTC and every report is dated a day
      # behind - NZ is 12-13 hours ahead, so "today" is almost always wrong.
      TZ: Pacific/Auckland
    command: uvicorn wyrmhoard.api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    # Lets the browser tests wait for readiness properly instead of sleeping
    # and hoping. Uses the interpreter already in the image - no curl needed.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    image: nginx:1.27-alpine
    container_name: wyrmhoard-web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web/src:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # How an AI agent drives this tool. Speaks MCP over stdio, so nothing is
  # listening on a port and the transport never touches the network.
  #
  # Point an agent at it with:
  #   docker compose -f /path/to/docker-compose.yml run --rm -T mcp
  #
  # Behind a profile so `docker compose up` does not start it - it is spawned
  # by whatever agent wants it, not left running.
  mcp:
    profiles: ["mcp"]
    build: ./api
    volumes:
      - ./api/wyrmhoard:/app/wyrmhoard
      - ./config:/config
      - ./data:/data
      - ./reports:/reports
    environment:
      WYRMHOARD_CONFIG_DIR: /config
      WYRMHOARD_DATA_DIR: /data
      WYRMHOARD_REPORT_DIR: /reports
      TZ: Pacific/Auckland
    stdin_open: true
    command: python -m wyrmhoard.mcp_server

  # The same MCP server over HTTP, for clients that cannot spawn a process -
  # Claude Desktop on Windows runs its servers in a sandbox that cannot see a
  # Docker installation inside WSL, so there is nothing for it to launch.
  #
  #   ./hoard mcp-http     then connect to http://localhost:8787/mcp
  #
  # Published on 127.0.0.1 only, exactly like the web API: reachable from this
  # machine, invisible to the network.
  mcp-http:
    profiles: ["mcp-http"]
    build: ./api
    container_name: wyrmhoard-mcp
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./api/wyrmhoard:/app/wyrmhoard
      - ./config:/config
      - ./data:/data
      - ./reports:/reports
    environment:
      WYRMHOARD_CONFIG_DIR: /config
      WYRMHOARD_DATA_DIR: /data
      WYRMHOARD_REPORT_DIR: /reports
      WYRMHOARD_MCP_TRANSPORT: streamable-http
      WYRMHOARD_MCP_PORT: "8787"
      TZ: Pacific/Auckland
    restart: unless-stopped
    command: python -m wyrmhoard.mcp_server

  # JavaScript linting. Behind a profile, and Node exists only for this - the
  # dashboard itself has no build step and no dependencies. Running it through
  # a container rather than requiring Node on the host keeps the promise that
  # `./hoard lint` and CI run exactly the same checks.
  #   ./hoard lint
  lint-js:
    profiles: ["lint"]
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./web:/web
    command: npx --yes eslint@9.17.0 src/js

  # Browser tests. Behind a profile so `docker compose up` never pulls the
  # 2GB Playwright image for someone who just wants to look at their money.
  #   ./hoard e2e
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright/python:v1.49.1-noble
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    environment:
      WYRMHOARD_E2E_URL: http://web
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    command: >
      bash -c "pip install --quiet --root-user-action=ignore -r requirements.txt
      && pytest -q --browser chromium"
