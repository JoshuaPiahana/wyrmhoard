server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The frontend is deliberately dumb about where the API lives - it just
    # calls /api/... and nginx routes it. That keeps a Stitch-generated
    # redesign a drop-in replacement: no build step, no env vars to rewire.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching during development - you will be iterating on the design.
    add_header Cache-Control "no-store";
}
