server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The frontend is deliberately dumb about where the API lives - it just
    # calls /api/... and nginx routes it. That keeps a Stitch-generated
    # redesign a drop-in replacement: no build step, no env vars to rewire.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_set_header   Host $host;
        proxy_read_timeout 300s;
    }

    # Lens readings. A lens is a consumer that writes reports/lenses/<name>.json;
    # the dashboard lists this directory to find out which exist, so it never
    # has to know one by name. Mounted read-only from the host - see
    # docker-compose.yml - and served as a plain directory because the API
    # deliberately has no part in it: a lens holds an opinion, the core does not.
    location /lenses/ {
        alias /lenses/;
        autoindex on;
        autoindex_format json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching during development - you will be iterating on the design.
    add_header Cache-Control "no-store";
}
